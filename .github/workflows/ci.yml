name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  # A local HTTP git remote makes a clean clone of this exact commit equivalent to
  # installing the same commit from a hosted git remote, without testing the
  # dependency-populated Actions checkout as a local-path package.
  pi-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Pi CLI outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/pi-cli"
          npm install --prefix "$RUNNER_TEMP/pi-cli" @earendil-works/pi-coding-agent@0.84.3
          echo "$RUNNER_TEMP/pi-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Smoke-test Pi git install and extension load
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/git-export"
          clean_source="$export_dir/ackneal/pi-gear"
          mkdir -p "$(dirname "$clean_source")" "$PI_CODING_AGENT_DIR"
          git clone --no-local "$GITHUB_WORKSPACE" "$clean_source"
          git -C "$clean_source" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$clean_source" rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$clean_source/node_modules"

          bare_repo="$export_dir/ackneal/pi-gear.git"
          git clone --bare "$clean_source" "$bare_repo"
          git --git-dir="$bare_repo" update-server-info
          python -m http.server 9418 --bind 127.0.0.1 --directory "$export_dir" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          pi install "git:http://127.0.0.1:9418/ackneal/pi-gear.git@$GITHUB_SHA"
          installed_package="$(find "$PI_CODING_AGENT_DIR/git" -name package.json -path '*/pi-gear/package.json' -print -quit)"
          test -n "$installed_package"
          installed_dir="${installed_package%/package.json}"
          test -d "$installed_dir/node_modules/@ff-labs/fff-bun"
          test -d "$installed_dir/node_modules/@ff-labs/fff-bin-linux-x64-gnu"

          # RPC startup loads configured extensions without selecting a model or
          # making an API request. A state response proves startup completed.
          python - <<'PY'
          import json
          import subprocess

          process = subprocess.Popen(
              ["pi", "--mode", "rpc", "--no-session", "--offline"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          try:
              stdout, stderr = process.communicate('{"type":"get_state","id":"smoke"}\n', timeout=30)
          except subprocess.TimeoutExpired:
              process.kill()
              stdout, stderr = process.communicate()
              raise SystemExit(f"Pi RPC startup timed out: {stderr}")
          if process.returncode != 0:
              raise SystemExit(f"Pi failed to load installed extension: {stderr}")
          if not any(json.loads(line).get("id") == "smoke" for line in stdout.splitlines()):
              raise SystemExit(f"Pi RPC state response missing: {stdout}\n{stderr}")
          PY

  sandbox-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Sandbox Runtime prerequisites
        run: |
          test -x /usr/bin/sandbox-exec
          mkdir -p /tmp/claude
          test -w /tmp/claude

      - name: Test macOS sandbox integration
        run: bun run test:sandbox:macos
